name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # lets you trigger a build manually from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK 27
        run: echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018"

      # Downloads Gradle 8.7 — no wrapper jar needed
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug
        working-directory: ${{ github.workspace }}

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/YotoGoGo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YotoGoGo
          path: app/build/outputs/apk/debug/YotoGoGo.apk
          retention-days: 30
